<!DOCTYPE HTML>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fiche patient</title>
    <div th:replace="~{fragments/header :: header-css}"></div>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/menu :: menu}"></div>
<div th:replace="~{fragments/toast :: toast}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">
            <span th:text="${patient.firstName}">Jean</span>
            <span th:text="${patient.lastName}">Dupont</span>
        </h1>
        <a class="btn btn-outline-secondary" th:href="@{/app/dashboard}">Retour à la liste</a>
    </div>

    <div class="row g-4">

        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header">État civil</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-body-secondary">Naissance</span>
                        <span th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}">12/05/1990</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-body-secondary">Genre</span>
                        <span th:text="${patient.gender}">M</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-body-secondary">Adresse</span>
                        <span th:text="${patient.postalAddress} ?: '—'">1 rue des Lilas</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span class="text-body-secondary">Téléphone</span>
                        <span th:text="${patient.phoneNumber} ?: '—'">100-222-3333</span>
                    </li>
                </ul>
                <div class="card-footer text-end">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/app/dashboard/{id}/update(id=${patientId})}">Modifier</a>
                </div>
            </div>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: header-js}"></div>
</body>
</html>
