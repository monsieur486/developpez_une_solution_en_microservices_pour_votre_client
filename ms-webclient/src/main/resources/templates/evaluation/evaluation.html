<!DOCTYPE HTML>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Evaluation rique patient</title>
    <div th:replace="~{fragments/header :: header-css}"></div>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container">
    <div class="starter-template">
        <h5>Evaluation risque patient</h5>
        <div th:if="${errorMessage}">
            <div th:replace="~{fragments/error-message :: error-message}"></div>
        </div>
        <p>Risque : <span th:text="${evaluation}"></span></p>
    </div>
    <p><a th:href="@{/app/patients/{id}/notes(id=${patientId})}">📝 Notes</a></p>
    <p><a th:href="@{'/app/patients/' + ${patientId}}">Retour à la fiche patient</a></p>
    <p><a th:href="@{/app/patients}">Retour à la liste des patients</a></p>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
