<!DOCTYPE HTML>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark" th:fragment="menu">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Dépistage diabète</a>
        <button class="navbar-toggler" data-bs-target="#menuPrincipal" data-bs-toggle="collapse"
                type="button">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/app/dashboard}">Patients</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text me-3" sec:authentication="name">praticien</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form method="post" th:action="@{/logout}">
                        <button class="btn btn-outline-light btn-sm" type="submit">Déconnexion</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Connexion</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
