spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ms-risque

  web:
    resources:
      add-mappings: false   # évite que les ressources statiques interceptent les 404

security:
  app-user:
    username: ${APP_USERNAME:app_user}
    password: ${APP_PASSWORD:app_password}

server:
  port: 9300

management:
  endpoints.web.exposure.include: health,info

eureka:
  client:
    registryFetchIntervalSeconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka
    registerWithEureka: true
    fetchRegistry: true
  instance:
    leaseRenewalIntervalInSeconds: 5


