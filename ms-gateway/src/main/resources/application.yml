spring:
  application:
    # Nom d'inscription dans Eureka.
    name: ms-gateway

  cloud:
    loadbalancer:
      cache:
        # Garde la liste des instances 5 s (défaut : 35 s) : un service relancé est routé plus vite.
        ttl: 5s
    gateway:
      server:
        webflux:
          # CORS : n'autorise que des pages servies par la gateway elle-même (interface Swagger). Le
          # webclient appelle la gateway depuis le serveur, pas depuis le navigateur : il n'est pas concerné.
          globalcors:
            # Applique aussi le CORS aux requêtes de pré-vérification (OPTIONS) sans route.
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # Origines autorisées : la gateway, sur le poste et sur le réseau Compose.
                allowedOrigins:
                  - "http://localhost:9000"
                  - "http://ms-gateway:9000"
                allowedMethods: [ GET, POST, PUT, PATCH, DELETE, OPTIONS ]
                allowedHeaders: [ "Authorization", "Content-Type", "Accept", "Origin", "X-Requested-With", "*" ]
                exposedHeaders: [ "Authorization" ]
                # Autorise l'envoi des identifiants HTTP Basic avec la requête.
                allowCredentials: true
          # Routes déclarées une à une plutôt que créées par découverte : une route de découverte
          # disparaît dès que son service quitte Eureka, et la gateway répond alors 404, que le
          # front prendrait pour un patient introuvable. Une route explicite reste en place ; sans
          # instance disponible, le load-balancer répond 503, qui signale bien une panne.
          routes:
            - id: ms-patients
              # « lb:// » : adresse résolue dans Eureka, appels répartis entre les instances.
              uri: lb://ms-patients
              predicates:
                - Path=/ms-patients/**
              filters:
                # Retire le préfixe du service : /ms-patients/patients → /patients.
                - StripPrefix=1
            - id: ms-notes
              uri: lb://ms-notes
              predicates:
                - Path=/ms-notes/**
              filters:
                - StripPrefix=1
            - id: ms-risque
              uri: lb://ms-risque
              predicates:
                - Path=/ms-risque/**
              filters:
                - StripPrefix=1

eureka:
  client:
    # Relit le registre toutes les 5 s (défaut : 30 s) pour suivre vite les arrêts et relances.
    registry-fetch-interval-seconds: 5

server:
  # Port d'entrée unique des API.
  port: 9000

management:
  endpoints:
    web:
      exposure:
        # Seuls la santé et les informations sont exposées par l'actuator.
        include: health,info

springdoc:
  api-docs:
    # Point de configuration lu par l'interface Swagger (/v3/api-docs/swagger-config).
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # N'affiche pas le contrat d'exemple « Petstore » fourni par défaut.
    disable-swagger-default-url: true
    # Contrats proposés dans le sélecteur, lus à travers la route de chaque service.
    urls:
      - name: ms-patients
        url: /ms-patients/v3/api-docs
      - name: ms-notes
        url: /ms-notes/v3/api-docs
      - name: ms-risque
        url: /ms-risque/v3/api-docs
    # Contrat affiché à l'ouverture de l'interface.
    urlsPrimaryName: ms-patients
