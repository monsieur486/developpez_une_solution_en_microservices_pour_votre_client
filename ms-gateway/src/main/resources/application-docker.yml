spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ms-gateway

# Les routes explicites viennent de application.yml : ce profil ne change que l'adresse d'Eureka.

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://ms-eureka:8761/eureka
    registerWithEureka: true
    fetchRegistry: true
