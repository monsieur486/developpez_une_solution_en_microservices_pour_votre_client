<!DOCTYPE HTML>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="toast-container position-fixed top-0 end-0 p-3" th:fragment="toast"
     th:if="${toastMessage}">
    <div aria-atomic="true" aria-live="assertive" class="toast align-items-center border-0 show"
         role="alert"
         th:classappend="${toastNiveau == 'erreur'} ? 'text-bg-danger'
                       : (${toastNiveau == 'avertissement'} ? 'text-bg-warning' : 'text-bg-success')">
        <div class="d-flex">
            <div class="toast-body" th:text="${toastMessage}">Message</div>
            <button aria-label="Fermer" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" type="button"></button>
        </div>
    </div>
</div>
</body>
</html>
