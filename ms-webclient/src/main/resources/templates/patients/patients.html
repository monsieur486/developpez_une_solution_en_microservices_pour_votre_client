<!DOCTYPE HTML>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Liste des patients</title>
    <th:block th:replace="~{fragments/header :: header-css}"/>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container">
    <div class="starter-template">
        <h5>Liste des patients</h5>
        <p><a th:href="@{/app/patients/ajout}">✚ Ajouter patient</a></p>
        <div th:if="${errorMessage}">
            <div th:replace="~{fragments/error-message :: error-message}"></div>
        </div>
        <table class="table table-striped" th:if="${page}">
            <thead>
            <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Date de naissance</th>
                <th>Genre</th>
                <th>Adresse postale</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="patient : ${page.content}">
                <td th:text="${patient.firstName}"></td>
                <td th:text="${patient.lastName}"></td>
                <td th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${patient.gender}"></td>
                <td th:text="${patient.postalAddress}"></td>
                <td th:text="${patient.phoneNumber}"></td>
                <td>
                    <a th:href="@{'/app/patients/' + ${patient.id}}">🎫 Fiche</a> |
                    <a th:href="@{'/app/patients/' + ${patient.id} +'/update' }">✍️ Modifier</a>
                </td>
            </tr>
            </tbody>
        </table>
        <nav th:if="${page != null && page.aPlusieursPages()}" aria-label="Navigation des pages de patients">
            <ul class="pagination">
                <li class="page-item" th:classappend="${page.page == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/app/patients(page=${page.page - 1})}">← Précédente</a>
                </li>
                <li class="page-item disabled">
                    <span class="page-link"
                          th:text="|Page ${page.page + 1} sur ${page.totalPages} (${page.totalElements} patients)|"></span>
                </li>
                <li class="page-item" th:classappend="${page.page + 1 >= page.totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/app/patients(page=${page.page + 1})}">Suivante →</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
