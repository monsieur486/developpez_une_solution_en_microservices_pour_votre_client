<!DOCTYPE HTML>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fiche patient</title>
    <th:block th:replace="~{fragments/header :: header-css}"/>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<div class="container">
    <div class="starter-template">
        <div th:if="${errorMessage}">
            <div th:replace="~{fragments/error-message :: error-message}"></div>
        </div>
        <div th:if="${patient}">
            <h5>Fiche patient
                <a th:href="@{/app/patients/{id}/update(id=${patient.id})}">✍️ modifier</a>
            </h5>
            <p>Prénom : <span th:text="${patient.firstName}"></span></p>
            <p>Nom : <span th:text="${patient.lastName}"></span></p>
            <p>Date de naissance : <span th:text="${#temporals.format(patient.birthDate, 'dd/MM/yyyy')}"></span></p>
            <p>Genre : <span th:text="${patient.gender}"></span></p>
            <p>Adresse : <span th:text="${patient.postalAddress}"></span></p>
            <p>Téléphone : <span th:text="${patient.phoneNumber}"></span></p>
            <p><a th:href="@{/app/patients/{id}/notes(id=${patient.id})}">📝 Notes</a></p>
            <p><a th:href="@{/app/patients/{id}/evaluation(id=${patient.id})}">⚠️ Risque</a></p>
            <p><a th:href="@{/app/patients}">Retour à la liste des patients</a></p>
        </div>
        <div th:if="${patient == null}">
            <p><a th:href="@{/app/patients}">Retour à la liste des patients</a></p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
