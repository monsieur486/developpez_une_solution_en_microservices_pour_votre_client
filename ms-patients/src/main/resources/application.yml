spring:
  config:
    # Secrets locaux lus depuis .env (copie de dist.env), s'il existe dans le dossier de lancement.
    import: optional:file:.env[.properties]

  application:
    # Nom d'inscription dans Eureka, repris aussi dans les réponses d'erreur.
    name: ms-patients

  datasource:
    # URL JDBC de la base des patients, sur le poste en développement.
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:patientsdb}
    # Compte PostgreSQL de l'application.
    username: ${POSTGRES_USER:patient_user}
    # Mot de passe PostgreSQL, sans valeur par défaut : à fournir par l'environnement.
    password: ${POSTGRES_PASSWORD}
    # Pilote JDBC PostgreSQL.
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schéma appartient à Liquibase : Hibernate vérifie seulement qu'il colle aux entités.
      ddl-auto: validate

  liquibase:
    # Point d'entrée des migrations du schéma.
    change-log: classpath:db/changelog/master.xml
    # Contextes actifs : « demo » insère les patients de test. Le défaut « prod » ne doit pas
    # être vidé : sans aucun contexte, Liquibase exécuterait aussi les changesets « demo ».
    contexts: ${LIQUIBASE_CONTEXTS:prod}

  web:
    resources:
      # API pure : aucun fichier statique servi, une URL inconnue donne un 404 JSON.
      add-mappings: false

security:
  app-user:
    # Utilisateur technique autorisé à appeler l'API en HTTP Basic.
    username: ${APP_USERNAME:app_user}
    # Son mot de passe, sans valeur par défaut : à fournir par l'environnement.
    password: ${APP_PASSWORD}

server:
  # Port HTTP du microservice.
  port: 9100

management:
  endpoints:
    web:
      exposure:
        # Seuls la santé et les informations sont exposées par l'actuator.
        include: health,info

eureka:
  client:
    service-url:
      # Adresse du registre Eureka, sur le poste en développement.
      defaultZone: http://localhost:8761/eureka
    # Inscrit le service dans le registre, pour que la gateway le trouve.
    registerWithEureka: true
    # Récupère le registre (utile dès qu'il appellera d'autres services).
    fetchRegistry: true
