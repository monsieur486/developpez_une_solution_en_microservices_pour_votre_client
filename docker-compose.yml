# Pile complète de Médilabo. Sans profil (./dev-start.sh), seules les deux bases démarrent ; le
# profil « fullstack » (./prod-start.sh) ajoute le registre, la gateway, les microservices et le front.
# Les secrets viennent de .env (copie de dist.env) : sans eux, Compose refuse de démarrer.
services:

  # Registre des services : chaque microservice s'y inscrit au démarrage.
  ms-eureka:
    build:
      context: .
      dockerfile: ms-eureka/Dockerfile
    container_name: ms-eureka
    profiles: ["fullstack"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
    # Lié à la boucle locale : le tableau de bord reste consultable depuis le poste,
    # mais personne d'autre ne peut y inscrire une fausse instance.
    ports:
      - "127.0.0.1:8761:8761"
    # Sain dès que l'actuator répond UP : les clients peuvent alors s'inscrire.
    # wget est fourni par l'image alpine, curl ne l'est pas.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Point d'entrée unique des API, et interface Swagger.
  ms-gateway:
    build:
      context: .
      dockerfile: ms-gateway/Dockerfile
    container_name: ms-gateway
    profiles: ["fullstack"]
    # Attend qu'Eureka soit sain, et pas seulement démarré, pour éviter les
    # « Connection refused » à l'inscription.
    depends_on:
      ms-eureka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "9000:9000"

  # Base relationnelle des fiches patients.
  patients-db:
    image: postgres:16
    container_name: patients-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientsdb}
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (voir dist.env)}
    # Lié à la boucle locale : la base n'est joignable que depuis le poste.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Base documentaire des notes, au texte libre.
  notes-db:
    image: mongo:8.0.14
    container_name: notes-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-notes_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?à définir dans .env (voir dist.env)}
    # Lié à la boucle locale : la base n'est joignable que depuis le poste.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - notes_data:/data/db

  # Applique les migrations Liquibase une seule fois, puis s'arrête : les répliques de
  # ms-patients ne se disputent pas le schéma.
  ms-patients-migration:
    build:
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    depends_on:
      - patients-db
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Ni serveur web ni inscription dans Eureka : ce conteneur ne fait que migrer la base.
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      EUREKA_CLIENT_ENABLED: "false"
      # Seule la migration a besoin du contexte : les répliques trouvent la base déjà à jour.
      LIQUIBASE_CONTEXTS: ${LIQUIBASE_CONTEXTS:-prod}
      # Accès à la base : sans valeur par défaut côté application, il doit être transmis ici.
      POSTGRES_DB: ${POSTGRES_DB:-patientsdb}
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (voir dist.env)}
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:?à définir dans .env (voir dist.env)}
    # Tâche ponctuelle : ne pas la relancer une fois terminée.
    restart: "no"

  # API des patients, en plusieurs instances que la gateway se répartit. Sans port publié :
  # elle n'est joignable que par la gateway et ms-risque.
  ms-patients:
    build:
      context: .
      dockerfile: ms-patients/Dockerfile
    profiles: ["fullstack"]
    deploy:
      replicas: ${REPLICA_MS_PATIENTS:-2}
    depends_on:
      ms-eureka:
        condition: service_started
      ms-gateway:
        condition: service_started
      # Démarre seulement une fois le schéma à jour.
      ms-patients-migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-patientsdb}
      POSTGRES_USER: ${POSTGRES_USER:-patient_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env (voir dist.env)}
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:?à définir dans .env (voir dist.env)}

  # API des notes, en plusieurs instances, sans port publié.
  ms-notes:
    build:
      context: .
      dockerfile: ms-notes/Dockerfile
    profiles: ["fullstack"]
    deploy:
      replicas: ${REPLICA_MS_NOTES:-2}
    depends_on:
      ms-eureka:
        condition: service_started
      ms-gateway:
        condition: service_started
      notes-db:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-notes_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?à définir dans .env (voir dist.env)}
      # Profil « demo » : insère les notes de démonstration ; le défaut « prod » n'en insère aucune.
      MONGOCK_PROFILES: ${MONGOCK_PROFILES:-prod}
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:?à définir dans .env (voir dist.env)}

  # Évaluation du risque de diabète, en plusieurs instances, sans port publié.
  ms-risque:
    build:
      context: .
      dockerfile: ms-risque/Dockerfile
    profiles: ["fullstack"]
    deploy:
      replicas: ${REPLICA_MS_RISQUE:-2}
    # Sans base propre : il interroge ms-patients et ms-notes, qui doivent donc être lancés.
    # Pas de dépendance à la gateway : il appelle les deux services directement, via Eureka.
    depends_on:
      ms-eureka:
        condition: service_started
      ms-patients:
        condition: service_started
      ms-notes:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:?à définir dans .env (voir dist.env)}

  # Interface web des praticiens : seul service publié avec la gateway et le registre.
  ms-webclient:
    build:
      context: .
      dockerfile: ms-webclient/Dockerfile
    profiles: ["fullstack"]
    container_name: ms-webclient
    depends_on:
      - ms-patients
      - ms-notes
      - ms-risque
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_USERNAME: ${APP_USERNAME:-app_user}
      APP_PASSWORD: ${APP_PASSWORD:?à définir dans .env (voir dist.env)}
    ports:
      - "${PORT_WEBCLIENT:-8080}:8080"

# Volumes nommés : les données survivent à « docker compose down » (mais pas à « down -v »).
volumes:
  db_data:
  notes_data:
