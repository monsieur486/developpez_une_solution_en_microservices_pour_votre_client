<!DOCTYPE HTML>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Connexion</title>
    <div th:replace="~{fragments/header :: header-css}"></div>
</head>
<body class="bg-body-tertiary">
<div th:replace="~{fragments/menu :: menu}"></div>

<main class="container py-5" style="max-width: 26rem;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h5 mb-3">Connexion</h1>

            <div class="alert alert-danger" th:if="${param.error}">
                Identifiant ou mot de passe incorrect.
            </div>
            <div class="alert alert-success" th:if="${param.logout}">
                Vous avez été déconnecté.
            </div>

            <form method="post" th:action="@{/login}">
                <div class="mb-3">
                    <label class="form-label" for="username">Identifiant</label>
                    <input class="form-control" id="username" name="username" required type="text"/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input class="form-control" id="password" name="password" required
                           type="password"/>
                </div>
                <button class="btn btn-primary w-100" type="submit">Se connecter</button>
            </form>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/header :: header-js}"></div>
</body>
</html>
