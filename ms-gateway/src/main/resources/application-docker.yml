# Profil « docker » : se superpose à application.yml, qui porte les routes, le CORS et Swagger.
# Seule l'adresse du registre change, les conteneurs se joignant par leur nom de service.

eureka:
  client:
    service-url:
      # Adresse du registre, joignable par le nom du service ms-eureka.
      defaultZone: http://ms-eureka:8761/eureka
